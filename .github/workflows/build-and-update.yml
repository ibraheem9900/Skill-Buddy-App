name: Build APK + Push OTA Update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  # Fast path: push JS changes to already-installed apps (no reinstall needed).
  # Requires the EXPO_TOKEN repository secret (https://expo.dev/settings/access-tokens).
  ota-update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check EXPO_TOKEN secret is set
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::EXPO_TOKEN secret is missing. Add it at repo Settings → Secrets and variables → Actions, then re-run this workflow."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: artifacts/skillbuddy

      - name: Install EAS CLI
        run: npm install -g eas-cli@21.8.0

      - name: Push OTA update (installed apps update automatically)
        run: eas update --channel preview --message "OTA update from ${{ github.sha }}"
        working-directory: artifacts/skillbuddy
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # Slow path: rebuild the APK so the GitHub Release install link always has
  # the latest code, and refresh the release asset.
  apk-build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check EXPO_TOKEN secret is set
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::EXPO_TOKEN secret is missing. Add it at repo Settings → Secrets and variables → Actions, then re-run this workflow."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: artifacts/skillbuddy

      - name: Install EAS CLI
        run: npm install -g eas-cli@21.8.0

      # eas-cli picks up EXPO_TOKEN from the job-level env automatically.
      # Do NOT run 'eas login --non-interactive' — it fails in CI.

      - name: Build Android APK (preview profile)
        run: eas build --platform android --profile preview --non-interactive
        working-directory: artifacts/skillbuddy

      - name: Wait for build to finish and download APK
        run: |
          set -euo pipefail

          echo "Waiting for build to appear and finish..."
          for i in $(seq 1 60); do
            BUILD_JSON=$(eas build:list --platform android --limit 5 --json --non-interactive 2>/dev/null || echo "[]")
            BUILD_ID=$(echo "$BUILD_JSON" | node -e "
              let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
                try {
                  const a=JSON.parse(d.indexOf('[')>=0?d.slice(d.indexOf('[')):d);
                  const sha=process.env.GITHUB_SHA;
                  const b=(a||[]).find(x=>x.status==='FINISHED'&&x.gitCommit&&x.gitCommit.commit===sha)||(a||[]).find(x=>x.status==='FINISHED'&&x.platform==='android');
                  if(b) console.log(b.id);
                  else process.exit(1);
                } catch(e) { process.exit(1); }
              })" 2>/dev/null) && break
            echo "  attempt $i — no finished build yet, waiting 30s..."
            sleep 30
          done

          if [ -z "${BUILD_ID:-}" ]; then
            echo "::error::No finished Android build found after 30 minutes"
            exit 1
          fi

          echo "Using build $BUILD_ID"
          APK_URL=$(eas build:view "$BUILD_ID" --json | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const i=d.indexOf('{');
              const b=JSON.parse(d.slice(i));
              const u=b.artifacts&&b.artifacts.buildUrl;
              if(!u) throw new Error('no buildUrl');
              console.log(u);
            })")

          echo "Downloading APK from $APK_URL"
          curl -fsSL "$APK_URL" -o SkillBuddy.apk
          ls -la SkillBuddy.apk
        working-directory: artifacts/skillbuddy
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK to GitHub Release
        run: |
          gh release upload v1.0.0-android SkillBuddy.apk --clobber \
            || gh release create v1.0.0-android SkillBuddy.apk --title "SkillBuddy Android v1.0.0" \
               --notes "Client install build. Install on Android: download the APK, open it, allow \"Install unknown apps\", then Install."
        working-directory: artifacts/skillbuddy
        env:
          GH_TOKEN: ${{ github.token }}
