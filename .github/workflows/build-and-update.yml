name: Build APK + Push OTA Update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  # Fast path: push JS changes to already-installed apps (no reinstall needed).
  # Requires the EXPO_TOKEN repository secret (https://expo.dev/settings/access-tokens).
  # Note: the secrets context is NOT allowed in jobs.<job_id>.if, so we read it
  # through job-level env and guard with a step instead.
  ota-update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check EXPO_TOKEN secret is set
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::EXPO_TOKEN secret is missing. Add it at repo Settings → Secrets and variables → Actions, then re-run this workflow."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Must match the pnpm version the lockfile was generated with (pnpm 10)
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: artifacts/skillbuddy

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push OTA update (installed apps update automatically)
        run: eas update --channel preview --message "OTA update from ${{ github.sha }}"
        working-directory: artifacts/skillbuddy

  # Slow path: rebuild the APK so the GitHub Release install link always has
  # the latest code, and refresh the release asset.
  apk-build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check EXPO_TOKEN secret is set
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::EXPO_TOKEN secret is missing. Add it at repo Settings → Secrets and variables → Actions, then re-run this workflow."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Must match the pnpm version the lockfile was generated with (pnpm 10)
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: artifacts/skillbuddy

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK (preview profile)
        run: eas build --platform android --profile preview --non-interactive
        working-directory: artifacts/skillbuddy

      - name: Download built APK
        run: |
          set -euo pipefail
          # Note: eas build:view has no --non-interactive flag.
          BUILD_ID=$(eas build:list --platform android --limit 10 --json --non-interactive | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const a=JSON.parse(d);const sha=process.env.GITHUB_SHA;const b=(a||[]).find(x=>x.status==='FINISHED'&&x.gitCommit&&x.gitCommit.commit===sha)||(a||[]).find(x=>x.status==='FINISHED');if(!b)throw new Error('no finished android build found');console.log(b.id)})")
          echo "Using build $BUILD_ID"
          APK_URL=$(eas build:view "$BUILD_ID" --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const b=JSON.parse(d);const u=b.artifacts&&b.artifacts.buildUrl;if(!u)throw new Error('no buildUrl in build:view output');console.log(u)})")
          curl -fsSL "$APK_URL" -o SkillBuddy.apk
          ls -la SkillBuddy.apk
        working-directory: artifacts/skillbuddy
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK to GitHub Release
        run: |
          gh release upload v1.0.0-android SkillBuddy.apk --clobber \
            || gh release create v1.0.0-android SkillBuddy.apk --title "SkillBuddy Android v1.0.0" \
               --notes "Client install build. Install on Android: download the APK, open it, allow \"Install unknown apps\", then Install."
        working-directory: artifacts/skillbuddy
        env:
          GH_TOKEN: ${{ github.token }}
